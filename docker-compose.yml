# ============================================================================
# Aeon Pterodactyl - docker-compose para el USUARIO FINAL
# ============================================================================
# Un solo archivo: levanta panel + base de datos + redis + wings.
# La imagen del panel (ghcr.io/leojanidem/aeon-pterodactyl) trae todo horneado.
#
# ANTES DE LEVANTAR, edita lo marcado con >>> <<< :
#   1. Contrasenas de la base de datos (3 sitios, deben coincidir).
#   2. APP_URL con la IP LAN de tu maquina.
#   3. APP_KEY (genera una con el Paso 1.1 del README).
#   4. TU_USUARIO en las rutas de volumenes de Wings (abajo).
#
# NOTA IMPORTANTE sobre Wings: los volumenes de servidores, el tmp y el
# machine-id se montan con RUTA IDENTICA host:contenedor. Es un requisito de
# Docker (Wings crea contenedores hijos via el socket del host, que resuelve
# esas rutas en el filesystem del host). No las cambies a rutas distintas.
# ============================================================================
name: aeon
services:
    database:
        container_name: aeon_database
        image: mariadb:10.11
        command: [--skip-ssl]
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: panel
            MYSQL_USER: pterodactyl
            MYSQL_PASSWORD: CAMBIA_ESTA_CONTRASENA        # >>> cambiala <<<
            MYSQL_ROOT_PASSWORD: CAMBIA_ESTA_ROOT         # >>> cambiala <<<
            TZ: America/New_York
        volumes:
            - ./data/database:/var/lib/mysql
        networks: [aeon_network]

    redis:
        container_name: aeon_redis
        image: redis:latest
        restart: unless-stopped
        networks: [aeon_network]

    panel:
        container_name: aeon_panel
        image: ghcr.io/leojanidem/aeon-pterodactyl:latest
        restart: unless-stopped
        depends_on: [database, redis]
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: "GENERA_TU_APP_KEY"                  # >>> Paso 1.1 del README <<<
            APP_TIMEZONE: America/New_York
            APP_URL: "http://CAMBIA_POR_TU_IP:4080"       # >>> tu IP LAN <<<
            DB_CONNECTION: mysql
            DB_HOST: database
            DB_PORT: "3306"
            DB_DATABASE: panel
            DB_USERNAME: pterodactyl
            DB_PASSWORD: CAMBIA_ESTA_CONTRASENA           # >>> igual que arriba <<<
            DB_SSLMODE: disabled
            CACHE_DRIVER: redis
            QUEUE_DRIVER: redis
            SESSION_DRIVER: redis
            REDIS_HOST: redis
        ports:
            - "4080:80"
        volumes:
            - ./data/panel-var:/app/var
            - ./data/panel-logs:/app/storage/logs
            - ./data/addon-pack:/app/public/addon-pack
        networks: [aeon_network]

    wings:
        container_name: aeon_wings
        image: ghcr.io/pterodactyl/wings:latest
        restart: unless-stopped
        depends_on: [panel]
        environment:
            TZ: America/New_York
            WINGS_PROC_PATH: /host/proc
        privileged: true
        ports:
            # SOLO el puerto del daemon. NO publiques aqui los puertos de juego:
            # cada servidor publica los suyos por su cuenta. Publicarlos aqui
            # causa "port is already allocated" al arrancar servidores.
            - "8080:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            # Config de Wings -> va a /etc/pterodactyl (NO ruta identica)
            - ./data/wings:/etc/pterodactyl
            # Estas TRES van con RUTA IDENTICA host:contenedor (requisito Docker):
            - /var/lib/pterodactyl/volumes:/var/lib/pterodactyl/volumes
            - /tmp/pterodactyl:/tmp/pterodactyl
            - /run/wings:/run/wings
        networks: [aeon_network]

networks:
    aeon_network:
        name: aeon_network
        driver: bridge
